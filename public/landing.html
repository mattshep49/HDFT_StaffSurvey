<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HDFT Staff Survey</title>
<style>
:root{--blue:#005eb8;--deep:#002f5f;--dark:#001c35;--cyan:#41c7ed;--aqua:#7fe4f4;--red:#e7242a;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-width:320px;min-height:100%;font-family:"Segoe UI",system-ui,sans-serif;background:var(--deep)}button{font:inherit}
.landing{position:fixed;inset:0;isolation:isolate;overflow:hidden;display:grid;grid-template-rows:auto 1fr auto;color:#fff;background:radial-gradient(circle at 75% 22%,rgb(65 199 237/.28),transparent 28rem),radial-gradient(circle at 12% 78%,rgb(127 228 244/.18),transparent 30rem),linear-gradient(145deg,var(--deep),var(--blue) 52%,#0879c9);transition:opacity .65s,transform .65s,visibility .65s}
.landing.leaving{opacity:0;visibility:hidden;transform:scale(1.025)}
.grid{position:absolute;inset:0;z-index:-2;opacity:.16;background-image:linear-gradient(rgb(255 255 255/.15) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255/.15) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(transparent,#000 25%,#000 70%,transparent)}
.glow{position:absolute;border-radius:50%;filter:blur(10px);opacity:.35;animation:float 9s ease-in-out infinite}.g1{width:18rem;height:18rem;top:8%;left:7%;background:rgb(65 199 237/.45)}.g2{width:25rem;height:25rem;right:2%;bottom:3%;background:rgb(255 255 255/.16);animation-delay:-3s}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:clamp(1.2rem,3vw,2.5rem) clamp(1.2rem,5vw,5rem);z-index:5}.org{color:rgb(255 255 255/.82);font-size:clamp(.72rem,1.2vw,.95rem);font-weight:650;letter-spacing:.045em;text-transform:uppercase}.trust-subtitle{color:rgb(255 255 255/.6);font-size:clamp(.6rem,1vw,.75rem);font-weight:400;letter-spacing:.06em;margin-top:.3rem;text-transform:lowercase}.skip,.continue{border-radius:999px;cursor:pointer;transition:.18s}.skip{border:1px solid rgb(255 255 255/.38);padding:.68rem 1rem;color:#fff;background:rgb(0 28 53/.2);backdrop-filter:blur(8px)}.skip:hover{color:var(--deep);background:#fff}.skip:focus-visible,.continue:focus-visible{outline:3px solid #ffeb3b;outline-offset:4px}
main{display:grid;place-items:center;padding:1rem clamp(1rem,4vw,4rem)}.intro,.identity{grid-area:1/1;width:min(94vw,1180px);display:flex;flex-direction:column;align-items:center;text-align:center;transition:.9s cubic-bezier(.22,1,.36,1)}.eyebrow,.overline{margin:0 0 1.2rem;color:rgb(255 255 255/.74);font-weight:700;letter-spacing:.24em;text-transform:uppercase}.stage{position:relative;width:min(94vw,1106px);height:clamp(125px,18vw,205px);display:flex;align-items:center}.wordmark{width:100%;height:auto;overflow:visible}.word-shadow,.word-ink{font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;font-size:62px;font-weight:600;letter-spacing:1px}.word-shadow{fill:rgb(255 255 255/.12)}.word-ink{fill:#fff}
.guide{fill:none;stroke:transparent}.ladybird-wrap{position:absolute;width:clamp(2.7rem,5.5vw,4.8rem);height:clamp(2.7rem,5.5vw,4.8rem);left:0;top:50%;opacity:0;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 5px rgb(0 20 40/.36))}.ladybird-wrap.moving{opacity:1}.ladybird{width:100%;height:100%;overflow:visible;animation:bob .36s ease-in-out infinite alternate}.legs{transform-origin:center;animation:legs .18s ease-in-out infinite alternate}.particle{position:absolute;z-index:3;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff 0 20%,var(--aqua) 30% 55%,transparent 72%);box-shadow:0 0 9px var(--aqua);animation:particle .9s ease-out forwards}.message{margin:1.2rem 0 0;color:rgb(255 255 255/.78);font-size:clamp(.9rem,1.8vw,1.2rem);letter-spacing:.035em;opacity:0;animation:reveal .7s ease 5s forwards}
.identity{opacity:0;visibility:hidden;transform:translateY(2rem) scale(.92)}.landing.logo .intro{opacity:0;visibility:hidden;transform:translateY(-2rem) scale(.96)}.landing.logo .identity{opacity:1;visibility:visible;transform:none}.dotlogo{display:flex;align-items:center;justify-content:center;line-height:.85;filter:drop-shadow(0 12px 28px rgb(0 28 53/.25))}.letter{font-size:clamp(6.5rem,18vw,13rem);font-weight:800;letter-spacing:-.08em}.o{position:relative;width:clamp(5.8rem,15vw,11rem);height:clamp(5.8rem,15vw,11rem);margin:0 clamp(.4rem,1.4vw,1rem);border:clamp(.6rem,1.7vw,1.2rem) solid rgb(255 255 255/.95);border-radius:50%;box-shadow:0 0 38px rgb(65 199 237/.25)}.orbit{position:absolute;inset:-.65rem;border:2px dashed rgb(127 228 244/.4);border-radius:50%;animation:spin 14s linear infinite}.logo-bug{position:absolute;top:-20%;left:50%;width:clamp(2.7rem,6vw,4.8rem);height:clamp(2.7rem,6vw,4.8rem);transform:translateX(-50%);animation:logoBug 2.5s ease-in-out infinite}.strap{margin:1.2rem 0 0;color:rgb(255 255 255/.86);font-size:clamp(1rem,2vw,1.35rem);letter-spacing:.14em}.continue{display:inline-flex;align-items:center;justify-content:center;gap:.7rem;max-width:min(92vw,42rem);margin-top:1.8rem;padding:.95rem 1.6rem;text-align:center;line-height:1.4;white-space:normal;border:1px solid #fff;color:var(--deep);background:#fff;font-weight:700;box-shadow:0 12px 28px rgb(0 28 53/.2)}.continue:hover{color:#fff;background:var(--deep);transform:translateY(-2px)}footer{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:.7rem;padding:1rem 1.5rem 1.6rem;color:rgb(255 255 255/.58);font-size:clamp(.65rem,1.1vw,.82rem)}.footer-dot{width:.3rem;height:.3rem;border-radius:50%;background:var(--aqua);box-shadow:0 0 8px var(--aqua)}
@keyframes write{to{stroke-dashoffset:0}}@keyframes reveal{to{opacity:1}}@keyframes float{50%{transform:translate(1.5rem,-1rem) scale(1.08)}}@keyframes bob{to{transform:scale(1.06)}}@keyframes legs{to{transform:skewX(3deg)}}@keyframes particle{0%{opacity:0;transform:scale(.25)}20%{opacity:1}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.15)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes logoBug{50%{transform:translateX(-50%) translateY(-.55rem) rotate(-8deg)}}
@media(max-width:600px){header{align-items:flex-start}.org{max-width:13rem;font-size:.64rem}.skip{font-size:.72rem;padding:.55rem .7rem}.stage{height:150px}.letter{font-size:clamp(5.2rem,27vw,7rem)}.o{width:clamp(4.4rem,22vw,5.8rem);height:clamp(4.4rem,22vw,5.8rem)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}.intro{display:none}.identity{opacity:1;visibility:visible;transform:none}}
</style>
</head>
<body>
<section class="landing" id="landing" aria-label="HDFT Staff Survey introduction">
  <div class="grid" aria-hidden="true"></div><span class="glow g1"></span><span class="glow g2"></span>
  <header>
    <div>
      <div class="org">Harrogate and District NHS Foundation Trust</div>
      <div class="trust-subtitle">Digital Opportunities Team</div>
    </div>
    <button class="skip" id="skip">Skip introduction</button>
  </header>
  <main>
    <div class="intro">
      <p class="eyebrow">Welcome to the</p>
      <div class="stage" id="stage">
        <svg class="wordmark" viewBox="0 0 1106 180" role="img" aria-label="HDFT Staff Survey">
          <defs>
            <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
              <feGaussianBlur stdDeviation="2.5" result="blur" />
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <clipPath id="writingReveal">
              <rect id="revealRect" x="0" y="0" width="0" height="180" />
            </clipPath>
          </defs>
          <text class="word-shadow" x="553" y="108" text-anchor="middle">HDFT Staff Survey 2026</text>
          <text class="word-ink" x="553" y="108" text-anchor="middle" clip-path="url(#writingReveal)" filter="url(#textGlow)">HDFT Staff Survey 2026</text>
          <path id="inkPath" class="guide" d="M55 108 C245 95 410 112 555 102 C720 91 875 111 1050 101" />
        </svg>
        <div class="ladybird-wrap moving" id="bug" aria-hidden="true">
          <svg class="ladybird" viewBox="0 0 100 100"><g class="legs" fill="none" stroke="#17212b" stroke-width="5" stroke-linecap="round"><path d="M35 42 17 31 8 34M31 55 13 55 5 64M35 68 18 79 12 90M65 42 83 31 92 34M69 55 87 55 95 64M65 68 82 79 88 90"/></g><ellipse cx="50" cy="57" rx="31" ry="36" fill="#e7242a" stroke="#6e0914" stroke-width="3"/><path d="M50 23v68" stroke="#520811" stroke-width="3"/><ellipse cx="50" cy="24" rx="20" ry="15" fill="#17212b"/><path d="M40 14 29 4M60 14 71 4" stroke="#17212b" stroke-width="4" stroke-linecap="round"/><g fill="#17212b"><circle cx="34" cy="43" r="6"/><circle cx="34" cy="66" r="7"/><circle cx="65" cy="43" r="6"/><circle cx="66" cy="66" r="7"/></g><ellipse cx="39" cy="43" rx="13" ry="19" fill="rgb(255 255 255/.22)"/></svg>
        </div>
      </div>
      <p class="message">Your feedback matters. Thank you for your time.</p>
    </div>
    <div class="identity">
      <p class="overline">Staff Survey 2026</p>
      <div class="dotlogo" aria-label="DOT"><span class="letter">D</span><span class="o"><span class="orbit"></span><span class="logo-bug" id="logoBug"></span></span><span class="letter">T</span></div>
      <p class="strap">Listen. Learn. Improve.</p>
      <button class="continue" id="continue">Begin the survey <span aria-hidden="true">→</span></button>
    </div>
  </main>
  <footer><span>Staff wellbeing at HDFT</span><span class="footer-dot"></span><span>Your voice matters</span></footer>
</section>
<script>
(() => {
 const landing=document.getElementById('landing'),stage=document.getElementById('stage'),bug=document.getElementById('bug'),ink=document.getElementById('inkPath'),logoBug=document.getElementById('logoBug'),revealRect=document.getElementById('revealRect');
 logoBug.innerHTML=bug.innerHTML;
 const duration=8600, delay=600, reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let start=null,lastParticle=0,raf;
 function placeBug(t){
   if(!start) start=t; const elapsed=t-start; const p=Math.max(0,Math.min(1,(elapsed-delay)/duration));
   const len=ink.getTotalLength(),pt=ink.getPointAtLength(len*p),next=ink.getPointAtLength(Math.min(len,len*p+2));
   const svg=ink.ownerSVGElement, r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
   const x=(pt.x-vb.x)/vb.width*r.width, y=(pt.y-vb.y)/vb.height*r.height;
   revealRect.setAttribute('width', String(1106*p));
   bug.style.left=x+'px'; bug.style.top=y+'px'; bug.style.rotate=(Math.atan2(next.y-pt.y,next.x-pt.x)*180/Math.PI+90)+'deg';
   if(elapsed>delay && t-lastParticle>85 && p<1){particle(x,y);lastParticle=t}
   if(p<1) raf=requestAnimationFrame(placeBug);
 }
 function particle(x,y){const e=document.createElement('i');e.className='particle';const s=3+Math.random()*5;e.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px;--dx:${-15+Math.random()*30}px;--dy:${-25-Math.random()*25}px`;stage.appendChild(e);setTimeout(()=>e.remove(),1000)}
 function finish(){landing.classList.add('leaving');setTimeout(()=>{landing.remove();document.getElementById('app').style.display='block'},650)}
 document.getElementById('skip').onclick=finish;document.getElementById('continue').onclick=finish;
 if(reduced){revealRect.setAttribute('width','1106');landing.classList.add('logo')}else{raf=requestAnimationFrame(placeBug);setTimeout(()=>landing.classList.add('logo'),delay+duration+1400)}
 window.addEventListener('beforeunload',()=>cancelAnimationFrame(raf));
})();
</script>
</body>
</html>
